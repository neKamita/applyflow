name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Integration tests start PostgreSQL, RabbitMQ and Redis with Testcontainers.
      - run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: "**/target/surefire-reports"

  e2e:
    name: End-to-end (docker compose)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Run the demo scenario
        run: ./scripts/demo.sh
      - name: Service logs
        if: always()
        run: docker compose logs --no-color application-service payment-service notification-service gateway
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Version comes from the packageManager field in frontend/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Bundle size budget
        run: pnpm size
      - run: pnpm exec playwright install --with-deps chromium
      - name: Component accessibility (axe, light and dark)
        run: pnpm test:stories
      - run: pnpm build-storybook --quiet
      - run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render and validate
        run: |
          cp k8s/secrets.env.example k8s/secrets.env
          kubectl kustomize k8s > rendered.yaml
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary /work/rendered.yaml
